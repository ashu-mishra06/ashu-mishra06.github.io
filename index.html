  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Set the theme before first paint so there is no flash: saved choice, else the visitor's system setting. */
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "chalk" : "graphite";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="bar top">

  <nav class="bar bottom" aria-label="Quick commands">

      <span class="wins" id="wins">
        <button type="button" class="win active" data-cmd="home" data-win="0">home</button>
